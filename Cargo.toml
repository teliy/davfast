[package]
name = "davfast"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
description = "Fast WebDAV client and cloud.mail.ru bridge for Linux: thousands of small files in parallel"
repository = "https://github.com/teliy/davfast"
readme = "README.md"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
httpdate = "1"
indicatif = "0.17"
libc = "0.2"
percent-encoding = "2"
quick-xml = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
